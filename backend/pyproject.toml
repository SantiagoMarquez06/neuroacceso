[project]
name = "neuroacceso-motor"
version = "0.1.0"
description = "Motor de NeuroAcceso: adquisición del casco, procesamiento en tiempo real y API local"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
neuroacceso-motor = "neuroacceso_motor.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroacceso_motor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
