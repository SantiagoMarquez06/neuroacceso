[project]
name = "neuroacceso"
version = "0.1.0"
description = "Control del PC y comunicación manos libres con Emotiv EPOC X"
requires-python = ">=3.10"
dependencies = ["websocket-client>=1.6", "pyautogui>=0.9.54", "pyttsx3>=2.90", "python-dotenv>=1.0"]

[project.optional-dependencies]
demo = ["websockets>=13", "pynput>=1.7"]
dev = ["pytest>=8", "websockets>=13"]

[project.scripts]
neuroacceso = "neuroacceso.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
